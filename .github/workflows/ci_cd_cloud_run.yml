name: CI/CD for Cloud Run

on:
  push:
    branches:
      - majd-ci-cd

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using service account credentials
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # Install gcloud CLI and configure project
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: curamet-onboarding

      # Configure Docker to authenticate to Artifact Registry
      - name: Configure Docker for Google Artifact Registry
        run: gcloud auth configure-docker europe-docker.pkg.dev --quiet

  terraform:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      # Checkout your repository (required to access your Terraform files)
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate again — each job gets a fresh runner
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # Set up gcloud CLI (optional, but useful for debugging)
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: curamet-onboarding

      # Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # Initialize Terraform
      - name: Terraform Init
        working-directory: terraform
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: terraform init --backend-config="environments/dev/backend.conf"

      # Apply Terraform for Artifact Registry
      - name: Terraform Apply for Artifact Registry
        working-directory: terraform
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          terraform apply \
            -target=module.operations.google_artifact_registry_repository.curamet-repo \
            -var-file="environments/dev/terraform.tfvars" \
            -auto-approve -no-color

  docker_build_push:
    needs: terraform
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository again
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # Set up Google Cloud SDK
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: curamet-onboarding

      # Set up Docker Buildx (for multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push Docker image to Artifact Registry
      - name: Build & Push Docker Image
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          IMAGE_URL="europe-docker.pkg.dev/curamet-onboarding/am-curamet-repo/am-demo-service:0.0.3"
          echo "🔧 Building Docker image: $IMAGE_URL"
          
          # Ensure Docker is authenticated to Google Artifact Registry
          gcloud auth configure-docker europe-docker.pkg.dev --quiet
          
          # Build and push
          docker buildx create --use --bootstrap
          docker buildx build --platform linux/amd64 \
            -t "$IMAGE_URL" \
            --push .

  deploy:
    needs: docker_build_push
    runs-on: ubuntu-latest

    steps:
      # Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # Set up Google Cloud SDK
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: curamet-onboarding

      # Deploy to Cloud Run
      - name: Deploy to Cloud Run
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          SERVICE_NAME="am-demo-service"
          REGION="europe-west1"
          IMAGE_URL="europe-docker.pkg.dev/curamet-onboarding/am-curamet-repo/am-demo-service:0.0.3"

          echo "🚀 Deploying $SERVICE_NAME to Cloud Run in $REGION"
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE_URL" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --project curamet-onboarding

          echo "✅ Deployment complete!"

  test:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      # Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # Set up Google Cloud SDK
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: curamet-onboarding

      # Get Cloud Run service URL
      - name: Get Cloud Run Service URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe am-demo-service \
            --region europe-west1 \
            --project curamet-onboarding \
            --format='value(status.url)')
          echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "🌐 Cloud Run URL: $SERVICE_URL"

      # Run basic health check
      - name: Health Check Test
        run: |
          echo "🔍 Testing service health endpoint..."
          curl -f "${{ steps.get-url.outputs.service_url }}/health" \
            || (echo "❌ Health check failed!" && exit 1)
          echo "✅ Service is healthy!"

      # Optional: Trigger Pub/Sub test endpoint
      - name: Trigger Pub/Sub Event (Optional)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          echo "🚀 Triggering Pub/Sub endpoint..."
          curl -X POST "${{ steps.get-url.outputs.service_url }}/push-trigger" \
            -H "Authorization: bearer $(gcloud auth print-identity-token)" \
            -H "Content-Type: application/json" \
            -d '{
                  "message": {
                    "data": "eyJuYW1lIjogIkRldmVsb3BlciJ9=",
                    "attributes": {"event": "test"}
                  }
                }' \
            && echo "✅ Pub/Sub endpoint test passed!"
